name: "🐞 Bug"
description: "Report a bug or unexpected behavior"
title: "[Bug]: "
labels: ["bug", "backlog"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is the bug?
      placeholder: Describe the bug clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can the issue be reproduced?
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Describe what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Describe what actually happened.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide relevant environment details.
      placeholder: |
        - OS:
        - .NET version:
        - Project:
        - Branch:
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      placeholder: Logs, screenshots, context, possible cause...
    validations:
      required: false
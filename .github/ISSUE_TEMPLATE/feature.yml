name: "🚀 Feature"
description: "Propose a new feature or capability"
title: "[Feature]: "
labels: ["feature", "backlog"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should be added?
      placeholder: Describe the feature in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: Why is this feature needed?
      placeholder: Explain the problem this feature solves.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work?
      placeholder: Describe the proposed implementation or behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Describe alternative approaches if any.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      placeholder: Links, sketches, API impact, UI notes...
    validations:
      required: false
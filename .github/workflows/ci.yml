name: CI

on:
  pull_request:
    branches: [ develop, main, 'release/**' ]
  push:
    branches: [ develop ]

jobs:
  build_test:
    # This job name will be used as a required check in branch protection
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            9.0.x
            8.0.x

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        # Fails if formatting differs from dotnet-format rules
        shell: bash
        run: |
          set -euo pipefail

          # 1) Neues CLI verfügbar? -> nutzt --verify-no-changes
          if dotnet help format >/dev/null 2>&1; then
            echo "Using built-in 'dotnet format'..."
            dotnet format --verify-no-changes --no-restore
            exit 0
          fi

          # 2) Fallback: Globales Tool (ältere SDKs) -> nutzt --check
          echo "Falling back to global tool 'dotnet-format'..."
          dotnet tool install -g dotnet-format

          # Workspace ermitteln: bevorzugt .sln, sonst Ordner
          SLN="$(find . -maxdepth 3 -type f -name '*.sln' -print -quit || true)"
          if [ -n "${SLN}" ]; then
            echo "Running dotnet-format on solution: ${SLN}"
            ~/.dotnet/tools/dotnet-format --check "${SLN}"
          else
            echo "No solution found; running on folder."
            ~/.dotnet/tools/dotnet-format --check --folder .
          fi

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore /warnaserror

      - name: Test with coverage
        shell: bash
        run: |
          dotnet test --configuration Release --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:ExcludeByFile="**/bin/**/*;**/obj/**/*;**/*.g.cs"
 
      - name: Enforce minimum coverage (60%)
        # Simple threshold check using reportgenerator's summary
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:**/coverage.cobertura.xml -targetdir:coverage-report -reporttypes:TextSummary
          echo "==== Coverage Summary ===="
          cat coverage-report/Summary.txt
          # Parse line coverage percent
          PCT=$(grep -Eo 'Line coverage: [0-9]+\.[0-9]+' coverage-report/Summary.txt | awk '{print $3}')
          # Convert to integer by truncating decimals
          PCT_INT=${PCT%.*}
          echo "Line coverage = ${PCT}%"
          if [ "${PCT_INT}" -lt 60 ]; then
            echo "Coverage below threshold (60%). Failing."
            exit 1
          fi
